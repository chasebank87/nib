name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: Build and test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Zig tests
        run: make test-zig

      - name: Swift package tests
        run: make test-swift

      - name: Build app
        run: make build
